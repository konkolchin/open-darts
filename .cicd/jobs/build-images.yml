docker-builder-image:
  stage: build_images
  tags:
    - linux
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs: []
  variables:
    # Files whose content determines the Docker image content hash.
    # When any of these files change, the image will be rebuilt.
    # Add space-separated paths here to extend the hash scope.
    DOCKER_HASH_FILES: >-
      ${CI_PROJECT_DIR}/.cicd/build-linux/Dockerfile
      ${CI_PROJECT_DIR}/.cicd/build-linux/Toolchain.cmake
      ${CI_PROJECT_DIR}/.cicd/jobs/build-images.yml
  before_script:
    # Set up registry auth for Kaniko (use username/password fields, not base64 auth)
    - mkdir -p /kaniko/.docker
    - printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > /kaniko/.docker/config.json
  script:
    # --- content-hash check (similar to apptainer-builder-gpu-image-base) ---
    - echo "Files included in content hash:" ${DOCKER_HASH_FILES}
    - CONTEXT_SHA=$(cat ${DOCKER_HASH_FILES} | sha256sum | awk '{print $1}')
    - BUILD_KEY=$(printf '%.16s' "$CONTEXT_SHA")
    - IMAGE_TAG="sha-${BUILD_KEY}"
    - FULL_IMAGE="${CI_REGISTRY_IMAGE}/linux-builder"
    - echo "Docker context hash => ${IMAGE_TAG}"
    # Check if image with this content hash already exists in registry.
    # Uses crane (bundled in kaniko debug image) with the same docker config
    # that kaniko uses for pushing — more reliable than a manual wget auth check.
    # Probe the registry with /kaniko/warmer (bundled in the kaniko:debug image
    # and sharing the same DOCKER_CONFIG auth as /kaniko/executor). A successful
    # warm means the manifest exists; any non-zero exit means we need to build.
    - |
      NEEDS_BUILD=1
      if [ "${UPDATE_DOCKER_IMAGE:-0}" != "1" ]; then
        if DOCKER_CONFIG=/kaniko/.docker /kaniko/warmer \
             --image="${FULL_IMAGE}:${IMAGE_TAG}" \
             --cache-dir=/tmp/kaniko-probe >/dev/null; then
          echo "Image ${FULL_IMAGE}:${IMAGE_TAG} already exists — skipping build"
          NEEDS_BUILD=0
        else
          echo "Image not found in registry — building..."
        fi
      else
        echo "UPDATE_DOCKER_IMAGE=1 — forcing rebuild"
      fi
    # --- build (only when needed) ---
    - |
      if [ "$NEEDS_BUILD" = "1" ]; then
        DEST_ARGS="--destination=${FULL_IMAGE}:${IMAGE_TAG}"
        if [ "${CI_COMMIT_REF_PROTECTED}" = "true" ]; then
          DEST_ARGS="${DEST_ARGS} --destination=${FULL_IMAGE}:latest"
        fi
        if [ -n "${CI_COMMIT_TAG:-}" ]; then
          DEST_ARGS="${DEST_ARGS} --destination=${FULL_IMAGE}:${CI_COMMIT_TAG}"
        fi
        # Push only from protected refs (branches/tags) AND only from pipeline
        # sources run under a real member's account (push, manual web run, schedule)
        # Trigger/API/cross-project pipelines run with the trigger owner's permissions
        # even on protected branches and may not have registry write access;
        # kaniko's push preflight would fail the job before building.
        # All non-pushing pipelines still validate the build.
        # Seeding a new image (including UPDATE_DOCKER_IMAGE=1 rebuilds) must
        # run as a push / web / scheduled pipeline on development/main.
        PUSH_OK=0
        if [ "${CI_COMMIT_REF_PROTECTED}" = "true" ] || [ -n "${CI_COMMIT_TAG:-}" ]; then
          case "${CI_PIPELINE_SOURCE}" in
            push|web|schedule) PUSH_OK=1 ;;
          esac
        fi
        if [ "$PUSH_OK" != "1" ]; then
          DEST_ARGS="--no-push"
        fi
        /kaniko/executor \
          --context "${CI_PROJECT_DIR}/.cicd/build-linux" \
          --dockerfile "${CI_PROJECT_DIR}/.cicd/build-linux/Dockerfile" \
          ${DEST_ARGS} \
          --snapshot-mode=redo \
          --use-new-run \
          --compressed-caching=false
      fi
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
    - if: $TEST_CUSTOM_BRANCH == "1"
    - if: $TEST_ALL_PYTHONS == "1"
    - if: $UPDATE_DOCKER_IMAGE == "1"

# ---------------------------------------------------------------------------
# Shared storage policy for every Apptainer image this pipeline keeps on the
# tahiti runner. Both image lanes write SIFs into one directory, so the
# retention rule and the directories live here once instead of being copied
# (and drifting) per lane. A lane only picks its IMAGE_PREFIX; the prune keys
# off that, so the lanes never touch each other's files.
# ---------------------------------------------------------------------------
.apptainer-image-store:
  tags:
    - linux_tahiti_gpu
  variables:
    # Heavy I/O on the large /data mount, NOT on NFS: apptainer unpacks base
    # images with xattrs, which NFS rejects.
    APPTAINER_TMPDIR: "/data/gitlab-runner/apptainer-tmp"
    APPTAINER_CACHEDIR: "/data/gitlab-runner/apptainer-cache"
    IMG_DIR: "/data/open-darts-apptainer-images"
    # How many images of one prefix to keep. One number for every lane -- if a
    # lane ever needs its own, override MAX_IMAGE_NUM there and say why.
    MAX_IMAGE_NUM: "5"
  after_script:
    # Retention, shared by every lane. Deletes oldest-first down to
    # MAX_IMAGE_NUM, skips the '<prefix>-latest.sif' symlink and refuses to
    # delete whatever it points at (a lane without such a symlink is
    # unaffected). after_script never fails the job, so a full disk shows up as
    # a build failure rather than a silently skipped clean-up.
    - |
      set -euo pipefail
      PREFIX="${IMAGE_PREFIX:?IMAGE_PREFIX must be set by the lane}"
      echo "Retention for ${PREFIX}-*.sif in ${IMG_DIR} (keep ${MAX_IMAGE_NUM})"
      LATEST_LINK="$IMG_DIR/${PREFIX}-latest.sif"
      LATEST_TARGET=""
      if [ -L "$LATEST_LINK" ]; then
        LATEST_TARGET="$(readlink -f "$LATEST_LINK" || true)"
        [ -n "$LATEST_TARGET" ] && echo "Will keep latest symlink target: $LATEST_TARGET"
      fi
      TMP_LIST="$(mktemp)"
      find "$IMG_DIR" -maxdepth 1 -type f -name "${PREFIX}-*.sif" ! -name "${PREFIX}-latest.sif" \
           -printf '%T@ %p\n' | sort -n | awk '{ $1=""; sub(/^ /,""); print }' > "$TMP_LIST"
      TOTAL="$(wc -l < "$TMP_LIST" | tr -d ' ')"
      MAX="${MAX_IMAGE_NUM:-5}"
      if [ "${TOTAL:-0}" -le "$MAX" ]; then
        echo "No pruning needed: ${TOTAL:-0} image(s) present (<= $MAX)."
      else
        TO_DELETE="$(( TOTAL - MAX ))"
        echo "Pruning $TO_DELETE oldest image(s) with prefix ${PREFIX}"
        DELETED=0
        while IFS= read -r IMG_PATH; do
          [ "$DELETED" -ge "$TO_DELETE" ] && break
          if [ -n "$LATEST_TARGET" ] && [ "$IMG_PATH" = "$LATEST_TARGET" ]; then
            echo "Keeping latest target $IMG_PATH"
            continue
          fi
          echo "Removing $IMG_PATH"
          rm -f -- "$IMG_PATH" || true
          DELETED=$(( DELETED + 1 ))
        done < "$TMP_LIST"
      fi
      rm -f "$TMP_LIST" || true

.apptainer-builder-gpu-image-base:
  extends: .apptainer-image-store      # storage dirs + retention
  stage: build_images
  needs: []
  variables:
    IMAGE_PREFIX: "open-darts"
    GITLAB_CI_TOOLS: "0"
    # Passed to builder-gpu-image.def as a build arg, so it has to take part in the
    # content hash below -- otherwise changing it would silently reuse the
    # image built against the previous toolkit.
    BUILDER_CUDA_VERSION: "12.8.1"
  before_script:
    - set -euo pipefail
    - mkdir -p "$APPTAINER_TMPDIR" "$APPTAINER_CACHEDIR" "$IMG_DIR"
  script:
    # hash image config
    - DEF_SHA="$(sha256sum .cicd/build-linux/builder-gpu-image.def | awk '{print $1}')"
    # hash other inputs that should trigger rebuild. NB this covers the whole
    # of build-images.yml, so editing apptainer-runtime-gpu-image further down also
    # invalidates the *builder* image and costs one rebuild -- deliberate
    # (over-invalidating is the safe direction) but worth knowing.
    - BLD_FILES_SHA="$(sha256sum .cicd/jobs/build-images.yml .gitlab-ci.yml | awk '{print $1}' | sha256sum | awk '{print $1}')"
    # hash the build args too -- they change the image as surely as the def does
    - ARGS_SHA="$(printf '%s\n%s\n%s\n' "${BUILDER_CUDA_VERSION}" "${ENABLE_AGENT_TOOLS:-0}" "${PY_VER:-}" | sha256sum | awk '{print $1}')"
    # combine into BUILD_KEY
    - BUILD_KEY="$(printf '%s\n%s\n%s\n' "$DEF_SHA" "$BLD_FILES_SHA" "$ARGS_SHA" | sha256sum | awk '{print $1}')"
    - echo "BUILD_KEY=$BUILD_KEY"
    - IMG="$IMG_DIR/${IMAGE_PREFIX}-${BUILD_KEY}.sif"
    - printf 'APPTAINER_IMAGE=%s\nAPPTAINER_BUILD_KEY=%s\n' "$IMG" "$BUILD_KEY" > apptainer_image.env
    # build only if not already present (cache/artifacts from previous runs)
    - |
      # The def file's %test section compiles and links a small CUDA program;
      # apptainer runs it as part of the build, so a broken image never reaches
      # the downstream compile jobs.
      build_image() {
        apptainer build --fakeroot \
          --build-arg CUDA_VERSION="${BUILDER_CUDA_VERSION}" \
          --build-arg ENABLE_AGENT_TOOLS="${ENABLE_AGENT_TOOLS:-0}" \
          "$IMG" .cicd/build-linux/builder-gpu-image.def
      }
      if [ "${UPDATE_APPTAINER_IMAGE:-0}" = "1" ]; then
        echo "UPDATE_APPTAINER_IMAGE=1 -- forcing rebuild of $IMG"
        rm -f -- "$IMG"
        build_image
      elif [ -f "$IMG" ]; then
        if apptainer inspect "$IMG" >/dev/null 2>&1; then
          echo "Reusing cached image $IMG";
        else
          echo "Cached image is corrupted, rebuilding: $IMG"
          rm -f -- "$IMG"
          build_image
        fi
      else
        build_image
      fi
    - |
      if [ "${CI_COMMIT_BRANCH:-}" = "development" ]; then
        ln -sf "$(basename "$IMG")" "$IMG_DIR/${IMAGE_PREFIX}-latest.sif"
      else
        echo "Skipping latest symlink (branch: ${CI_COMMIT_BRANCH:-})"
      fi
  cache:
    key: "$BUILD_KEY"
    paths:
      - "$IMG"
  artifacts:
    reports:
      dotenv: apptainer_image.env
    paths:
      - apptainer_image.env

apptainer-builder-gpu-image:
  extends: .apptainer-builder-gpu-image-base
  variables:
    IMAGE_PREFIX: "open-darts"
    ENABLE_AGENT_TOOLS: "0"
  rules:
      - if: $MCP_TRIGGER_TAHITI_GPU == "1"
        when: never
      - if: $CI_COMMIT_REF_PROTECTED == "true"
      - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
      - if: $TEST_CUSTOM_BRANCH == "1"
      - if: $TEST_ALL_PYTHONS == "1"


