# ---------------------------------------------------------------------------
# Portable open-DARTS GPU *runtime* image.
#
# Distinct from apptainer-builder-gpu-image above, which produces the *builder*
# image that compiles open-DARTS. This one produces the artifact end users
# pull: a slim SIF with open-DARTS already installed. test-apptainer-runtime-gpu
# (.cicd/jobs/test-linux-gpu.yml) runs the suite inside it, and
# deploy-apptainer-runtime-gpu-image (.cicd/jobs/deploy.yml) publishes it.
#
# Two modes:
#
#   validation (default: MRs, and protected branches other than development)
#       Assemble the image around the wheel build-linux-tahiti-image-gpu just
#       produced. That wheel is compiled for the runner's own GPU, so the image
#       is for testing, not for shipping -- but it costs ~8 minutes instead of a
#       multi-architecture compile, and it means every MR exercises the real
#       image: the venv, the CUDA closure check, the runscript and the GPU
#       self-test.
#
#   portable (development push/web/schedule pipelines, release tags, or
#             RUN_RUNTIME_IMAGE=1)
#       Compile the multi-architecture wheel first, so the image runs on every
#       GPU generation the project supports. This is the artifact that gets
#       published -- from every development pipeline and every release tag --
#       and deploy-apptainer-runtime-gpu-image refuses anything else.
#
# See docs/for_developers/ci_cd_gpu_images.md.
# ---------------------------------------------------------------------------

.apptainer-runtime-gpu-image-base:
    extends: .apptainer-image-store      # storage dirs + retention
    variables:
        # NOT "open-darts-gpu": the builder lane prunes "open-darts-*.sif" in
        # this same directory and would eat these.
        IMAGE_PREFIX: "darts-gpu"
        # The builder lane's prefix, used only to find a builder image to
        # compile in (see before_script) -- not this lane's own retention key.
        BUILDER_IMAGE_PREFIX: "open-darts"
        # Overridable so the image can be matched to a runner's driver. 12.8 is
        # the only toolkit spanning sm_70 (Volta CI runner) to sm_120 (RTX 5090).
        RUNTIME_CUDA_VERSION: "12.8.1"
        RUNTIME_CUDA_ARCH: "70-real;80-real;90-real;100-real;120-real;120-virtual"
        RUNTIME_CPU_ARCH: "x86-64-v3"
        # "validation" reuses the upstream wheel; "portable" compiles a
        # multi-architecture one. Release tags force portable (see below).
        RUNTIME_IMAGE_MODE: "validation"
    rules:
        - if: $MCP_TRIGGER_TAHITI_GPU == "1"
          when: never
        # development publishes every pipeline's image (see
        # deploy-apptainer-runtime-gpu-image), and only a portable image may be
        # published -- so build it portable. Same condition as the deploy job,
        # so a pipeline that will not publish is not charged the long build.
        - if: $CI_COMMIT_BRANCH == "development" && $CI_PIPELINE_SOURCE =~ /^(push|web|schedule)$/
          variables:
            RUNTIME_IMAGE_MODE: "portable"
        - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
          variables:
            RUNTIME_IMAGE_MODE: "portable"
        - if: $RUN_RUNTIME_IMAGE == "1"
          variables:
            RUNTIME_IMAGE_MODE: "portable"
        - if: $RUN_RUNTIME_IMAGE_DEPLOY == "1"
          variables:
            RUNTIME_IMAGE_MODE: "portable"
        # The MR lane: the test job runs inside this image, so it has to exist
        # wherever test-apptainer-runtime-gpu does.
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $TEST_CUSTOM_BRANCH == "1"
        - when: never

apptainer-runtime-gpu-image:
    # stage: build, not build_images, despite sitting with the image builders.
    # In validation mode the image is assembled around the wheel from
    # build-linux-tahiti-image-gpu: the wheel is installed into it, and ldd checks
    # that the CUDA runtime libraries the image installs cover the wheel's .so
    # files. `needs:` may only name jobs in the same or an earlier stage, so in
    # build_images the whole pipeline config is invalid with
    #   need build-linux-tahiti-image-gpu is not defined in current or prior stages
    stage: build
    extends: .apptainer-runtime-gpu-image-base
    # A four-architecture CUDA compile plus thirdparty is hours, not minutes.
    timeout: 8h
    needs:
        # Both optional: their rules are narrower than this lane's, and a hard
        # need on a job that was never created makes the whole pipeline config
        # invalid. Validation mode wants the wheel; portable mode wants the
        # builder image. Whichever is missing is handled below.
        - job: build-linux-tahiti-image-gpu
          artifacts: true
          optional: true
        - job: apptainer-builder-gpu-image
          artifacts: true
          optional: true
    before_script:
        - set -euo pipefail
        - mkdir -p "$APPTAINER_TMPDIR" "$APPTAINER_CACHEDIR" "$IMG_DIR"
        - |
          # Prefer the upstream dotenv, then the shared 'latest' symlink, then
          # the newest builder image on the runner. If none exists,
          # build_runtime_image.sh builds one itself (slow but correct), so this
          # is a fallback chain rather than a failure.
          if [ -z "${APPTAINER_IMAGE:-}" ] || [ ! -f "${APPTAINER_IMAGE:-}" ]; then
            CAND="$(readlink -f "$IMG_DIR/${BUILDER_IMAGE_PREFIX}-latest.sif" 2>/dev/null || true)"
            if [ -z "$CAND" ] || [ ! -f "$CAND" ]; then
              CAND="$(find "$IMG_DIR" -maxdepth 1 -type f -name "${BUILDER_IMAGE_PREFIX}-*.sif" \
                        ! -name "${BUILDER_IMAGE_PREFIX}-latest.sif" -printf '%T@ %p\n' \
                      | sort -nr | head -n1 | cut -d' ' -f2-)"
            fi
            APPTAINER_IMAGE="${CAND:-}"
          fi
          if [ -n "$APPTAINER_IMAGE" ] && [ -f "$APPTAINER_IMAGE" ]; then
            echo "Builder image: $APPTAINER_IMAGE"
            export APPTAINER_IMAGE
          else
            echo "No builder image on this runner; build_runtime_image.sh will make one."
            unset APPTAINER_IMAGE || true
          fi
    script:
        # The image content depends on both the recipe and the source it compiles,
        # so the cache key is the recipe hash plus the commit. Re-running a
        # pipeline on the same commit reuses the image; a new commit rebuilds.
        - |
          DEF_SHA="$(sha256sum .cicd/build-linux/runtime-gpu-image.def \
                                .cicd/build-linux/build_runtime_image.sh \
                                .cicd/jobs/build-images.yml \
                     | sha256sum | awk '{print $1}')"
          BUILD_KEY="$(printf '%s-%.12s-%.12s' "${RUNTIME_IMAGE_MODE}" "$CI_COMMIT_SHA" "$DEF_SHA")"
          IMG="$IMG_DIR/${IMAGE_PREFIX}-${BUILD_KEY}.sif"
          echo "BUILD_KEY=$BUILD_KEY"
          printf 'RUNTIME_IMAGE=%s\nRUNTIME_BUILD_KEY=%s\n' "$IMG" "$BUILD_KEY" > runtime_image.env
          if [ -f "$IMG" ] && [ "${UPDATE_RUNTIME_IMAGE:-0}" != "1" ] && apptainer inspect "$IMG" >/dev/null 2>&1; then
            echo "Reusing cached runtime image $IMG"
            exit 0
          fi
          rm -f -- "$IMG"
          # The venv in the image must match the Python the wheel was compiled
          # with, which for every CI lane is DEFAULT_PY_VER. If it is somehow
          # unset, say nothing and let build_runtime_image.sh read the wheel's
          # own ABI tag rather than pass an empty --py-ver.
          PY_ARG=""
          if [ -n "${DEFAULT_PY_VER:-}" ]; then
            PY_ARG="--py-ver ${DEFAULT_PY_VER}"
          else
            echo "DEFAULT_PY_VER is unset; deriving the image's Python from the wheel"
          fi
          MODE_ARGS=""
          if [ "${RUNTIME_IMAGE_MODE}" = "portable" ]; then
            # Compile the multi-architecture wheel in the builder image.
            if [ -n "${APPTAINER_IMAGE:-}" ]; then
              MODE_ARGS="--builder-image $APPTAINER_IMAGE"
            fi
            MODE_ARGS="$MODE_ARGS --cuda-arch ${RUNTIME_CUDA_ARCH} --cpu-arch ${RUNTIME_CPU_ARCH} -j 16"
          else
            # Reuse the wheel build-linux-tahiti-image-gpu produced. It is a
            # `native` build for this runner's GPU, so label it honestly --
            # deploy-apptainer-runtime-gpu-image checks this label and refuses to publish it.
            WHEEL="$(ls -t ./dist/*.whl 2>/dev/null | head -n1 || true)"
            if [ -z "$WHEEL" ]; then
              echo "validation mode needs the wheel artifact from build-linux-tahiti-image-gpu" >&2
              ls -la ./dist 2>/dev/null || true
              exit 1
            fi
            echo "Validation image from $WHEEL (single-architecture, not for release)"
            MODE_ARGS="--wheel $WHEEL --cuda-arch ci-validation-native --cpu-arch native"
          fi
          # shellcheck disable=SC2086
          ./.cicd/build-linux/build_runtime_image.sh \
              $MODE_ARGS \
              --output "$IMG" \
              $PY_ARG \
              --cuda-version "$RUNTIME_CUDA_VERSION"
          apptainer inspect "$IMG"
          ls -lh "$IMG"
    artifacts:
        reports:
            dotenv: runtime_image.env
        paths:
            - runtime_image.env
            - '*.log'
        expire_in: 1 week
        when: always
