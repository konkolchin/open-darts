deploy-pypi:
    # Publish the release
    # Runs only for the main branch and if tag has a pattern: v#.#.#, for example "v1.2.3"
    rules:
        - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
    extends: .deploy-pypi
    variables:
        REPO: 'pypi'
        REPOUSER: $PYPIUSER
        REPOPWD: $PYPIPWD

deploy-testpypi:
    # Test publishing the release
    # Runs only manually, if variable UPLOAD_TEST_PYPI set to 1
    only:
        variables:
            - $UPLOAD_TEST_PYPI == "1"
    extends: .deploy-pypi
    variables:
        REPO: 'testpypi'
        REPOUSER: $TESTPYPIUSER
        REPOPWD: $TESTPYPIPWD

# pick all whl ODLS-artifacts (windows/linux, different python versions) and upload to test pipy
# TODO auto-increment package version (in pyproject.toml and .gitlab-ci.yml) and add git tag; now it is done manually
.deploy-pypi:
    stage: deploy
    # just for twine
    image: "python:$DEFAULT_PY_VER"
    # Will be executed on runner with windows tag - that assumed to run on windows host
    tags:
        - linux
    before_script:
        # upgrade pip package first
        - python -m pip install --upgrade pip
        - pip install twine
    script:
        # upload to test-pypi or pypi depending on $PYPI var
        - ./helper_scripts/rename_whls.sh # rename linux whls to make uploadable to test-pypi
        - ls ./dist/*
        - twine upload -u $REPOUSER -p $REPOPWD --repository $REPO --verbose dist/*
    dependencies:
        # get the wheels from the build stage
        - build-linux
        - build-windows

deploy-zenodo:
    stage: deploy
    rules:
        - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
    tags:
        - linux
    image: "python:$DEFAULT_PY_VER"
    script:
        # cloning gitlab2zenodo in a temporary folder
        - mkdir tmp_gitlab2zenodo
        - cd tmp_gitlab2zenodo
        - git clone https://gitlab.com/sbeniamine/gitlab2zenodo.git
        - cd gitlab2zenodo
        # and installing gitlab2zenodo
        - pip install .
        - cd ../..
        # making a .zip containing the source files
        - git archive --format zip --output ${CI_COMMIT_TAG#v}.zip ${CI_COMMIT_TAG}
        # command that publishes to zenodo
        - g2z-send -p -m .zenodo.json ${CI_COMMIT_TAG#v}.zip

pages:
    stage: deploy
    rules:
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
        - if: $DOCS_PAGES == "1"
    tags:
        - linux
    image: "python:$DEFAULT_PY_VER"
    script:
        # re-install open-darts with the dependencies for building the documentation
        - pip install .[docs]
        # use the wheel generated in build to install open-darts
        - export DEFAULT_PY_TAG="cp${DEFAULT_PY_VER/./}"
        - pip install --force-reinstall --no-deps ./dist/*${DEFAULT_PY_TAG}-linux_x86_64.whl
        - cd docs
        # command to build the documentation to a folder called public
        - sphinx-build -b html . public
        # move the folder public to the root of the project to be able to save it as artifact
        - mv public ../
    artifacts:
        paths:
        - public
    dependencies:
        - build-linux

# ---------------------------------------------------------------------------
# Publish the portable GPU runtime image built by apptainer-runtime-gpu-image
# (.cicd/jobs/build-images.yml) to the GitLab container registry over ORAS.
#
# This is the only Apptainer image the project publishes. The builder image is
# a CI tool: it stays on the tahiti runner's disk (apptainer-builder-gpu-image
# keeps the newest few and an open-darts-latest.sif symlink) and is never pushed.
#
#   development pipeline         ->  darts-gpu:latest, darts-gpu:<sha12>
#   release tag vX.Y.Z           ->  darts-gpu:X.Y.Z,  darts-gpu:<sha12>
#   RUN_RUNTIME_IMAGE_DEPLOY=1   ->  darts-gpu:<sha12>   (other protected refs)
# ---------------------------------------------------------------------------
deploy-apptainer-runtime-gpu-image:
    stage: deploy
    tags:
        - linux_tahiti_gpu
    variables:
        # Pushing a 1.5 GB SIF stages through the temp dir; /tmp on the runner is
        # not sized for that. (It no longer inherits this from the build lane's
        # template, so it is stated here.)
        APPTAINER_TMPDIR: "/data/gitlab-runner/apptainer-tmp"
        APPTAINER_CACHEDIR: "/data/gitlab-runner/apptainer-cache"
    needs:
        - job: apptainer-runtime-gpu-image
          artifacts: true
        - job: test-apptainer-runtime-gpu
    rules:
        - if: $MCP_TRIGGER_TAHITI_GPU == "1"
          when: never
        # Every development pipeline publishes the image it built and tested.
        # push/web/schedule only -- trigger and API pipelines run with the
        # trigger owner's permissions, which may not include registry write
        # (the reasoning docker-builder-image applies to its own pushes).
        # apptainer-runtime-gpu-image uses the same condition to switch to
        # portable mode, so an image is never built portable and then dropped.
        - if: $CI_COMMIT_BRANCH == "development" && $CI_PIPELINE_SOURCE =~ /^(push|web|schedule)$/
        - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/
        # Protected only: this job hard-needs test-apptainer-runtime-gpu, which
        # exists only on protected refs, tags and MRs -- and publishing from an
        # arbitrary branch is not something to make easy anyway.
        - if: $RUN_RUNTIME_IMAGE_DEPLOY == "1" && $CI_COMMIT_REF_PROTECTED == "true"
        - when: never
    script:
        - set -euo pipefail
        - |
          if [ -z "${RUNTIME_IMAGE:-}" ] || [ ! -r "$RUNTIME_IMAGE" ]; then
            echo "runtime image unavailable: ${RUNTIME_IMAGE:-<unset>}" >&2
            exit 2
          fi
          apptainer inspect "$RUNTIME_IMAGE" >/dev/null || { echo "corrupted image" >&2; exit 2; }
        # Never publish a validation image: it is compiled for whichever GPU the
        # runner happened to have and would strand everyone else. The check is
        # on the exact marker validation mode writes, so a deliberate
        # single-architecture release (--cuda-arch 90, say) is still allowed --
        # it only gets a warning.
        - |
          ARCH_LABEL="$(apptainer inspect "$RUNTIME_IMAGE" 2>/dev/null | sed -n 's/^CUDA_ARCH: *//p')"
          echo "image CUDA_ARCH label: ${ARCH_LABEL:-<none>}"
          if [ "$ARCH_LABEL" = "ci-validation-native" ]; then
            echo "FATAL: this is a CI validation image (single GPU architecture)." >&2
            echo "       Rebuild with RUNTIME_IMAGE_MODE=portable before publishing." >&2
            exit 1
          fi
          case "$ARCH_LABEL" in
            *\;*) : ;;
            *) echo "WARNING: publishing an image with a single GPU target (${ARCH_LABEL:-<none>})" >&2 ;;
          esac
        - apptainer registry login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "oras://$CI_REGISTRY"
        - |
          REPO="$CI_REGISTRY_IMAGE/darts-gpu"
          # The immutable coordinate is always safe to push.
          TAGS="${CI_COMMIT_SHA:0:12}"
          if [ -n "${CI_COMMIT_TAG:-}" ]; then
            TAGS="${CI_COMMIT_TAG#v} $TAGS"
          elif [ "${CI_COMMIT_BRANCH:-}" = "development" ]; then
            # `latest` is a moving pointer, so only ever move it forward. A
            # portable build takes about an hour, so development pipelines
            # finish out of order, and old pipelines get re-run -- either would
            # otherwise point `latest` back at an older commit. Only claim it
            # while this commit is still the tip of development.
            TIP="$(git ls-remote origin refs/heads/development 2>/dev/null | cut -f1 || true)"
            if [ "$TIP" = "$CI_COMMIT_SHA" ]; then
              TAGS="latest $TAGS"
            elif [ -z "$TIP" ]; then
              echo "WARNING: could not read the tip of development; leaving 'latest' untouched" >&2
            else
              echo "development has moved on to ${TIP:0:12}; leaving 'latest' to that pipeline"
            fi
          fi
          for t in $TAGS; do
            echo "Pushing oras://$REPO:$t"
            apptainer push "$RUNTIME_IMAGE" "oras://$REPO:$t"
          done
          echo
          for t in $TAGS; do echo "Pull with:  apptainer pull oras://$REPO:$t"; done
