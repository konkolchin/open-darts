workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE =~ /(\[skip ci\]|\[ci skip\]|\[skip pipeline\]|\[skip-cicd\]|\[skip cicd\]|\[skip-cd\]|\[skip cd\])/i'
      when: never
    # Reference regeneration (UPLOAD_PKL=1) runs the full model set on the current branch:
    # force TEST_ALL_MODELS and TEST_CUSTOM_BRANCH so the user does not have to set them too.
    - if: '$UPLOAD_PKL == "1"'
      variables:
        TEST_ALL_MODELS: "1"
        TEST_CUSTOM_BRANCH: "1"
      when: always
    # Draft MR pipeline -> MR_NON_DRAFT stays "0" (fast checks only).
    # CI_MERGE_REQUEST_DRAFT is the authoritative flag; the title regex is a fallback for the cases when variable is not defined.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_DRAFT == "true" || $CI_MERGE_REQUEST_TITLE =~ /^\s*(\[draft\]|\(draft\)|draft:)/i)'
      variables:
        MR_NON_DRAFT: "0"
      when: always
    # Ready (non-draft) MR pipeline -> the "final check": valgrind + full model set.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        MR_NON_DRAFT: "1"
      when: always
    # Push to an UNPROTECTED branch that has an open MR -> the MR pipeline above covers it; skip the duplicate branch pipeline.
    # Protected branches (development, main) are excluded: they are MR sources themselves (e.g. development -> main),
    # and their push pipelines are the integration check, not a duplicate.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_REF_PROTECTED != "true"'
      when: never
    - when: always

# ---------------------------------------------------------------------------
# Pipeline-level switches
# ---------------------------------------------------------------------------
variables:
  # Proprietary BOS-solvers CI twins: build-linux-BOS / test-linux-BOS and
  # build-windows-BOS / test-windows-BOS (ENABLE_BOS_SOLVERS=ON, `-a` build flag).
  #
  #   "0" (default) -> all four BOS twins are skipped pipeline-wide
  #   "1" -> enable all four BOS twins for an explicitly opted-in pipeline
  # Set RUN_BOS_JOBS=1 in a manual or scheduled pipeline to run them.
  RUN_BOS_JOBS: "0"
  # Set by workflow:rules above: "1" only for merge-request pipelines whose MR is NOT a draft.
  # Enables the longer valgrind job in MR pipelines and the test_all_models selection in models/run_test_suite2.py.
  # Marking an MR ready does not start a pipeline by itself: play the manual build-linux-valgrind job
  # in the existing pipeline, or push a commit / run a new pipeline to also get test_all_models.
  MR_NON_DRAFT: "0"
  # Model testbench (https://gitlab.com/open-darts/testbench) in the GPU runtime image, see .cicd/jobs/testbench.yml.
  #   "0" -> not run
  #   "1" -> trigger-testbench starts a testbench pipeline that runs the variants of TESTBENCH_MODELS (empty: all
  #          models) in the tiers of TESTBENCH_TIER (both space-separated), on tahiti inside this pipeline's runtime
  #          image, all on the GPU
  # On its own the testbench runs the full models of spe10 (tiers nightly and weekly without the smoke tests) without
  # VTK; the values below run them for all models, with VTK. Other variables of its gpu job, such as
  # TESTBENCH_EXCLUDE_VARIANTS, can be set for a pipeline and are forwarded as well.
  RUN_TESTBENCH: "1"
  TESTBENCH_MODELS: ""
  # all but the smoke tests (tier mr), the hours-long full tier and the unvalidated manual variants, licence-restricted
  # ones included (about 1 h 40 min with TESTBENCH_VTK)
  TESTBENCH_TIER: "nightly weekly"
  # "1": a VTK snapshot of every DartsModel.run() call and an animation (video) per variant, kept as testbench
  # artefacts. The runs get slower, but not the open-DARTS simulation timer, so their performance is still tested
  TESTBENCH_VTK: "1"

stages:
    - pre_commit
    - build_images
    - build
    - test
    # Valgrind: present in EVERY merge-request pipeline. In a draft pipeline
    # build-linux-valgrind is a blocking manual job, so the pipeline stays
    # "blocked" (not green) until it is played.
    - final_validation
    - deploy
    - ingest

include:
  - local: '.cicd/jobs/build-linux-gpu.yml'
  - local: '.cicd/jobs/pre-commit.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/cleanup-windows.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/build-images.yml'
  - local: '.cicd/jobs/build-linux.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/build-windows.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/build-linux-valgrind.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/test-linux.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/test-windows.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/test-linux-gpu.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/testbench.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/valgrind-check.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  # - local: '.cicd/jobs/vtune-profile.yml'
    # rules:
    # - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/upload-wheels.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/deploy.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  # - local: '.cicd/jobs/darts-models.yml'
  #   rules:
  #     - if: $MCP_TRIGGER_TAHITI_GPU != "1"
  - local: '.cicd/jobs/gitingest.yml'
    rules:
      - if: $MCP_TRIGGER_TAHITI_GPU != "1"
